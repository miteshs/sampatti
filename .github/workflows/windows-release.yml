# Windows installer build.
#
#   • Tag push (v*): runs the full gate (vitest + tsc + cargo test, incl. a real Credential
#     Manager round-trip on the runner), builds the NSIS installer, and uploads it to the
#     matching release on the PUBLIC miteshs/sampatti-releases repo — alongside the macOS dmg
#     that scripts/release.sh publishes.
#   • Manual run (workflow_dispatch): same build, but the .exe is attached to the run as an
#     artifact for VM click-testing. No release is touched.
#
# Public-by-construction: no secret is baked into any build — hosted-relay access is a
# user-entered access code, never a build-time token — so Windows artifacts carry nothing a
# stranger could extract. Users paste their access code (or add their own Anthropic key under
# Developer mode, stored in the Credential Manager).
#
# The build is UNSIGNED (no paid certificate), so SmartScreen still warns once —
# "More info → Run anyway". To make that warning trustworthy instead of scary, every tagged
# build ships a transparency bundle attached to the release:
#   • SHA-256 checksum (SHA256SUMS-windows.txt) so users can verify the download is intact.
#   • A VirusTotal scan link (needs the optional VT_API_KEY secret; skipped if absent).
# (Build-provenance attestation was dropped: GitHub won't persist attestations for a
# user-owned PRIVATE repo — re-add actions/attest-build-provenance if this repo goes public.)
# See docs/windows.md for the user-facing "is this safe?" walkthrough.

name: windows-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Tag must match the app version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${VERSION}"
            exit 1
          fi

      - run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Typecheck + frontend build (cargo needs dist/ for generate_context!)
        run: npm run build

      - name: Rust tests (incl. Credential Manager round-trip on this runner)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Bundle targets come from src-tauri/tauri.windows.conf.json (nsis only).
      - name: Build NSIS installer (token-less public build)
        run: npx tauri build

      - name: Locate installer + checksum
        id: exe
        run: |
          EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          echo "path=$EXE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$EXE")" >> "$GITHUB_OUTPUT"
          SHA=$(sha256sum "$EXE" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          # Checksums file carries just the basename so `sha256sum -c` works after download.
          ( cd "$(dirname "$EXE")" && sha256sum "$(basename "$EXE")" ) > "$GITHUB_WORKSPACE/SHA256SUMS-windows.txt"
          echo "sha256: $SHA"

      # VirusTotal scan — needs the optional VT_API_KEY secret (free account at virustotal.com).
      # continue-on-error so a missing key or VT hiccup never blocks a release.
      - name: VirusTotal scan
        if: github.ref_type == 'tag'
        id: vt
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: ${{ steps.exe.outputs.path }}

      - name: Attach to this run (manual build for click-testing)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sampatti-windows-x64
          path: ${{ steps.exe.outputs.path }}

      # Cross-repo upload — needs the RELEASES_TOKEN secret: a fine-grained PAT with
      # Contents read/write on miteshs/sampatti-releases (see docs/windows.md).
      - name: Publish to miteshs/sampatti-releases
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Step outputs reach the script as env vars, never inlined into the script text —
          # inlining ${{ }} into run: is the GH Actions script-injection antipattern.
          EXE_PATH: ${{ steps.exe.outputs.path }}
          EXE_NAME: ${{ steps.exe.outputs.name }}
          SHA256: ${{ steps.exe.outputs.sha256 }}
          # crazy-max/ghaction-virustotal emits "filepath=url[,filepath=url]"; "" if VT skipped.
          VT_ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="miteshs/sampatti-releases"

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "Sampatti ${TAG#v}" \
              --notes "Windows x64 installer below. macOS: download the signed, notarized \`.dmg\` and double-click it — it self-installs into Applications. AI analysis is optional (access code or your own Anthropic key, in Settings). All portfolio data stays on your device."
          fi

          # Build the Windows verification block (idempotent: a marked region we replace on re-run).
          VT_URL="${VT_ANALYSIS#*=}"   # strip "filepath=" prefix; empty if VT was skipped
          BLOCK=$'<!-- win-verify -->\n### Verify the Windows download\n'
          BLOCK+="The \`.exe\` is unsigned, so SmartScreen warns once — **More info → Run anyway**. "$'It is safe to verify before running:\n\n'
          BLOCK+="- **SHA-256** (\`$EXE_NAME\`): \`$SHA256\`"$'\n'
          BLOCK+="  Check it: \`sha256sum -c SHA256SUMS-windows.txt\` (or \`certutil -hash <file> SHA256\` on Windows)."$'\n'
          if [ -n "$VT_URL" ]; then
            BLOCK+="- **VirusTotal scan:** $VT_URL"$'\n'
          fi
          BLOCK+=$'<!-- /win-verify -->'

          # Re-fetch current body, drop any previous block, append the fresh one.
          BODY=$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body')
          CLEAN=$(printf '%s\n' "$BODY" | sed '/<!-- win-verify -->/,/<!-- \/win-verify -->/d')
          gh release edit "$TAG" --repo "$REPO" --notes "$(printf '%s\n\n%s\n' "$CLEAN" "$BLOCK")"

          # Upload the installer + checksum.
          gh release upload "$TAG" "$EXE_PATH" --repo "$REPO" --clobber
          gh release upload "$TAG" "$GITHUB_WORKSPACE/SHA256SUMS-windows.txt" --repo "$REPO" --clobber
