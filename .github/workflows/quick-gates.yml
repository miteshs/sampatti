# Fast verification on every push/PR — main is only as trustworthy as what runs against it.
# (The Windows workflow runs the full platform gates at release time; this one keeps every
# commit honest for cheap: 1×-minute ubuntu runners.)
#
#   gates: vitest (incl. privacy/egress/version contracts, fuzz, migration) + tsc +
#          relay tests + production-dependency audit
#   e2e:   the built app driven by real Chrome through the whole user journey

name: quick-gates

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit, component, contract & fuzz tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Relay tests
        run: cd relay && npm ci && npx vitest run
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  rust-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2
        with:
          tool: cargo-audit
      - name: RUSTSEC advisories against Cargo.lock
        run: cargo audit --file src-tauri/Cargo.lock

  e2e:
    runs-on: ubuntu-latest
    # A hung Chrome once sat "in_progress" for 2¼ hours (2026-06-11) — the default
    # job timeout is 6h of billable runner time. Generous ceiling, not a perf target.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: chrome
      - run: npm ci
      - run: npm run build
      - name: Smoke — the whole user journey in real Chrome (+ axe a11y gate)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run e2e
      - name: Visual regression (saves candidates while linux baselines are absent)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run e2e:visual
      - name: Upload visual candidates / diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-candidates
          path: scripts/e2e/.candidates/
          if-no-files-found: ignore
