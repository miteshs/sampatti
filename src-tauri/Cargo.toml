[package]
name = "sampatti"
version = "0.5.0"
description = "Private, India-first portfolio analysis"
authors = ["you"]
edition = "2021"

[lib]
name = "sampatti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
# The platform keystores are opt-in features in keyring v3 — without them EVERY platform
# silently falls back to the in-memory mock store and the saved key dies with the process.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Embedded on-device inference (llama.cpp) — DESKTOP ONLY. On Apple silicon llama.cpp defaults
# to FULL Metal offload (verified in the Phase-2 eval logs: every layer assigned to MTL0);
# elsewhere it runs on CPU. Excluded on mobile by this target cfg so llama.cpp's C++ never has
# to cross-compile to the iOS simulator/device — and because on-device AI is gated off on iOS
# by the RAM floor anyway (SPEC §6.10 / docs/local-ai.md Phase 4). The `local_llm` module and
# its Tauri commands are correspondingly `#[cfg(desktop)]` in lib.rs.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
llama-cpp-2 = "0.1"
