[package]
name = "sampatti"
version = "0.2.1"
description = "Private, India-first portfolio analysis"
authors = ["you"]
edition = "2021"

[lib]
name = "sampatti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
# The platform keystores are opt-in features in keyring v3 — without them EVERY platform
# silently falls back to the in-memory mock store and the saved key dies with the process.
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
